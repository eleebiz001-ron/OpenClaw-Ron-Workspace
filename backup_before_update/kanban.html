<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ron's Task Board</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --todo-border: #cf6679;
            --progress-border: #03dac6;
            --done-border: #3700b3;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 20px;
        }
        .board {
            display: flex;
            gap: 20px;
            flex: 1;
            overflow-x: auto;
        }
        .column {
            flex: 1;
            min-width: 300px;
            background-color: #161616;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        .column-header {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #333;
        }
        .column-todo .column-header { color: var(--todo-border); border-color: var(--todo-border); }
        .column-progress .column-header { color: var(--progress-border); border-color: var(--progress-border); }
        .column-done .column-header { color: var(--done-border); border-color: var(--done-border); }

        .task-card {
            background-color: var(--card-bg);
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .task-card:hover {
            transform: translateY(-2px);
        }
        .task-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 1.1em;
        }
        .task-desc {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 10px;
        }
        .task-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: #666;
            margin-bottom: 5px;
        }
        .task-dates {
            font-size: 0.75em;
            color: #888;
            border-top: 1px solid #333;
            padding-top: 5px;
            margin-top: 5px;
        }
        .badge {
            background-color: #333;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>🤵‍♂️ Ron's Work Status</h1>
    <div class="board">
        <div class="column column-todo" id="col-todo">
            <div class="column-header">To Do (할 일)</div>
            <!-- Tasks will go here -->
        </div>
        <div class="column column-progress" id="col-progress">
            <div class="column-header">In Progress (진행 중)</div>
            <!-- Tasks will go here -->
        </div>
        <div class="column column-done" id="col-done">
            <div class="column-header">Done (완료)</div>
            <!-- Tasks will go here -->
        </div>
    </div>

          {

            "title": "시각적 대시보드 (Floating Dashboard)",
            "status": "To Do",
            "assignee": "Ron",
            "desc": "캔버스를 활용한 중력 없는 데이터 시각화 개발 (Priority #1)",
            "startDate": "",
            "endDate": ""
          }
        ];

        function loadTasks() {
            renderTasks(tasks);
        }

        function renderTasks(tasks) {
            const cols = {
                'To Do': document.getElementById('col-todo'),
                'In Progress': document.getElementById('col-progress'),
                'Done': document.getElementById('col-done')
            };

            tasks.forEach(task => {
                const card = document.createElement('div');
                card.className = 'task-card';
                
                let dateHtml = '';
                if (task.startDate) {
                    dateHtml += `<div>시작: ${task.startDate}</div>`;
                }
                if (task.endDate) {
                    dateHtml += `<div>완료: ${task.endDate}</div>`;
                }

                card.innerHTML = `
                    <div class="task-title">${task.title}</div>
                    <div class="task-desc">${task.desc || ''}</div>
                    <div class="task-meta">
                        <span class="badge">${task.assignee}</span>
                        <span>ID: ${task.id}</span>
                    </div>
                    <div class="task-dates">
                        ${dateHtml}
                    </div>
                `;
                
                if (cols[task.status]) {
                    cols[task.status].appendChild(card);
                }
            });
        }

        loadTasks();
    </script>
</body>
</html>
